<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | JobFinder</title>
    <link rel="stylesheet" href="messages.css">
</head>

<body>

    <div class="messages-container">

        <div class="messages-card">

            <div class="page-header">
                <div>
                    <h1>Messages</h1>
                    <p>Communicate with candidates and employers.</p>
                </div>

                <a href="dashboard.html" class="back-btn">
                    ← Dashboard
                </a>
            </div>

           <div class="message-box">

    <h3>Send Message</h3>

    <label>To</label>
    <input type="text" id="receiver" readonly>

    <label>Message</label>
    <textarea id="messageText"
              placeholder="Type your message..."></textarea>

    <button onclick="sendMessage()">Send Message</button>

    <p id="messageStatus"></p>

</div>

        </div>

    </div>
<script>
const params = new URLSearchParams(window.location.search);

const receiverName = params.get("name");
const receiverId = params.get("userId");

document.getElementById("receiver").value =
    receiverName || "Candidate not selected";

async function sendMessage() {

    const message =
        document.getElementById("messageText").value.trim();

    const status =
        document.getElementById("messageStatus");

    const loggedInUser =
        JSON.parse(localStorage.getItem("user"));

    if (!loggedInUser || !loggedInUser.id) {
        status.textContent = "Please login first.";
        return;
    }

    if (!receiverId) {
        status.textContent = "Receiver not selected.";
        return;
    }

    if (message === "") {
        status.textContent = "Please enter a message.";
        return;
    }

    try {

        const response = await fetch(
            "http://localhost:5000/api/messages",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    sender_id: loggedInUser.id,
                    receiver_id: Number(receiverId),
                    message: message
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            status.textContent =
                data.message || "Failed to send message.";
            return;
        }

        status.textContent =
            "Message sent successfully!";

        document.getElementById("messageText").value = "";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Cannot connect to server.";

    }

}
</script>
</body>
</html>
