<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post a Job | JobFinder</title>

    <link rel="stylesheet" href="post-job.css">
</head>

<body>

<div class="post-job-container">

    <div class="post-job-card">

        <h1>Post a New Job</h1>

        <p>
            Create a job opportunity and find the right candidate.
        </p>

        <form id="jobForm">

            <!-- Job Title -->
            <label for="jobTitle">Job Title</label>

            <input
                type="text"
                id="jobTitle"
                placeholder="e.g. Frontend Developer"
                required
            >

            <!-- Company Name -->
            <label for="company">Company Name</label>

            <input
                type="text"
                id="company"
                placeholder="e.g. ABC Technologies"
                required
            >

            <!-- Location -->
            <label for="location">Location</label>

            <input
                type="text"
                id="location"
                placeholder="e.g. Chennai"
                required
            >

            <!-- Job Type -->
            <label for="jobType">Job Type</label>

            <select id="jobType" required>

                <option value="">
                    Select job type
                </option>

                <option value="Full Time">
                    Full Time
                </option>

                <option value="Part Time">
                    Part Time
                </option>

                <option value="Internship">
                    Internship
                </option>

                <option value="Remote">
                    Remote
                </option>

            </select>

            <!-- Salary -->
            <label for="salary">Salary</label>

            <input
                type="text"
                id="salary"
                placeholder="e.g. ₹5 LPA"
                required
            >

            <!-- Description -->
            <label for="description">
                Job Description
            </label>

            <textarea
                id="description"
                rows="5"
                placeholder="Describe the job..."
                required
            ></textarea>

            <!-- Publish -->
            <button
                type="submit"
                class="publish-btn"
            >
                Publish Job
            </button>

        </form>

        <!-- Back -->
        <a
            href="dashboard.html"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>

    </div>

</div>

<!-- JavaScript -->
<script src="post-job.js"></script>

</body>
</html>
