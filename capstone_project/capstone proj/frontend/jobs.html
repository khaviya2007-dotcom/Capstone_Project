<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Jobs | JobFinder</title>

    <link
        rel="stylesheet"
        href="jobs.css"
    >

</head>


<body>


<!-- ============================================
     PAGE HEADER
============================================ -->

<header class="page-header">

    <h1>My Jobs</h1>

    <p>
        Manage your job postings
    </p>

</header>



<!-- ============================================
     JOB LIST
============================================ -->

<main class="jobs-container">

    <div id="jobsList"></div>

</main>



<!-- ============================================
     JAVASCRIPT
============================================ -->

<script>

    // ============================================
    // GET JOB LIST ELEMENT
    // ============================================

    const jobsList =
        document.getElementById("jobsList");


    // ============================================
    // DISPLAY JOBS
    // ============================================

    function displayJobs() {

        let jobs = [];


        // ============================================
        // GET JOBS FROM LOCAL STORAGE
        // ============================================

        try {

            const storedJobs =
                localStorage.getItem("jobs");

            if (storedJobs) {

                jobs = JSON.parse(storedJobs);

            }

        } catch (error) {

            console.error(
                "Error reading jobs:",
                error
            );

            jobs = [];

        }


        // Make sure jobs is array

        if (!Array.isArray(jobs)) {

            jobs = [];

        }


        // ============================================
        // NO JOBS
        // ============================================

        if (jobs.length === 0) {

            jobsList.innerHTML = `

                <div class="empty-jobs">

                    <h2>
                        No Jobs Posted Yet
                    </h2>

                    <p>
                        Start by posting your
                        first job opportunity.
                    </p>

                    <a
                        href="post-job.html"
                        class="post-job-btn"
                    >
                        Post a Job
                    </a>

                </div>

            `;

            return;

        }


        // ============================================
        // CLEAR OLD CONTENT
        // ============================================

        jobsList.innerHTML = "";


        // ============================================
        // DISPLAY EVERY JOB
        // ============================================

        jobs.forEach(function (job, index) {


            // Create card

            const jobCard =
                document.createElement("div");


            jobCard.className =
                "job-card";


            // ============================================
            // JOB CARD HTML
            // ============================================

            jobCard.innerHTML = `

                <div class="job-card-header">

                    <div>

                        <h2>
                            ${job.title || "Untitled Job"}
                        </h2>

                        <span class="job-type">
                            ${job.type || "Job"}
                        </span>

                    </div>

                </div>


                <p class="job-location">
                    📍 ${job.location || "Location not specified"}
                </p>


                <p class="job-salary">
                    💰 ${job.salary || "Salary not specified"}
                </p>


                <p class="job-description">
                    ${job.description || "No description available."}
                </p>


                <p class="job-date">
                    📅 Posted on:
                    ${job.postedDate || "N/A"}
                </p>


                <div class="job-actions">

                    <button
                        class="delete-btn"
                        onclick="deleteJob(${index})"
                    >
                        Delete
                    </button>

                </div>

            `;


            // Add card to page

            jobsList.appendChild(jobCard);

        });

    }



    // ============================================
    // DELETE JOB
    // ============================================

    function deleteJob(index) {

        let jobs =
            JSON.parse(
                localStorage.getItem("jobs")
            ) || [];


        // Remove selected job

        jobs.splice(index, 1);


        // Save updated jobs

        localStorage.setItem(
            "jobs",
            JSON.stringify(jobs)
        );


        // Refresh display

        displayJobs();

    }



    // ============================================
    // LOAD JOBS
    // ============================================

    displayJobs();

</script>


</body>

</html>
