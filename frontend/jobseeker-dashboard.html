<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Seeker Dashboard | JobPortal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
        }

        .navbar {
            height: 70px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .navbar h2 {
            font-size: 24px;
        }

        .logout {
            background: white;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 35px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #64748b;
            margin-bottom: 12px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        #jobs {
            display: grid;
            gap: 15px;
        }

        .job {
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 10px;
        }

        .job h3 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .job p {
            margin: 5px 0;
            color: #475569;
        }

        .apply-btn {
            margin-top: 12px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>💼 JobPortal</h2>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>


    <div class="container">

        <div class="welcome">

            <h1 id="welcomeText">
                Welcome Back 👋
            </h1>

            <p>
                Find your dream job and manage your applications.
            </p>

        </div>


        <div class="cards">

            <div class="card">
                <h3>Available Jobs</h3>
                <p id="jobCount">0</p>
            </div>

            <div class="card">
                <h3>My Applications</h3>
                <p id="applicationCount">0</p>
            </div>

            <div class="card">
                <h3>Profile</h3>
                <p>✓</p>
            </div>

        </div>


        <div class="section">

            <h2>🔎 Available Jobs</h2>

            <div id="jobs">

                <p>Loading jobs...</p>

            </div>

        </div>

    </div>


    <script>

        // Get logged-in user
        const userData = localStorage.getItem("user");

        if (!userData) {

            window.location.href = "jobseeker-login.html";

        } else {

            const user = JSON.parse(userData);

            document.getElementById("welcomeText").innerText =
                "Welcome Back, " + user.name + " 👋";

        }
        async function loadApplications() {

    const userData = localStorage.getItem("user");

    if (!userData) {
        return;
    }

    const user = JSON.parse(userData);

    try {

        const response = await fetch(
            "http://localhost:5000/api/applications/" 
        );

        const data = await response.json();
        console.log("USER:", user);
console.log("APPLICATIONS:", data);

        const applications = Array.isArray(data)
            ? data
            : (data.applications || []);
            const myApplications = applications.filter(
            app => Number(app.user_id) === Number(user.id)
        );

        document.getElementById("applicationCount").innerText =
            myApplications.length;

        } catch (error) {
        console.error("Applications Error:", error);
    }
}

        
          

                

                   
    async function loadJobs() {

    try {

        const response = await fetch(
            "http://localhost:5000/api/jobs"
        );

        if (!response.ok) {
            throw new Error("Jobs API failed: " + response.status);
        }

        const data = await response.json();

        console.log("JOBS:", data);

        const jobs = Array.isArray(data)
            ? data
            : (data.jobs || data.data || []);

        const jobsContainer =
            document.getElementById("jobs");

        document.getElementById("jobCount").innerText =
            jobs.length;

        jobsContainer.innerHTML = "";

        if (jobs.length === 0) {

            jobsContainer.innerHTML =
                "<p>No jobs available currently.</p>";

            return;
        }

        jobs.forEach(job => {

            const jobDiv =
                document.createElement("div");

            jobDiv.className = "job";

            jobDiv.innerHTML = `

                <h3>${job.title || "Job Opportunity"}</h3>

                <p>
                    🏢 ${job.company || "Company"}
                </p>

                <p>
                    📍 ${job.location || "Location not specified"}
                </p>

                <p>
                    💰 ${job.salary || "Salary not specified"}
                </p>

                <p>
                    💼 ${job.description || "No description available"}
                </p>

                <button
                    class="apply-btn"
                    onclick="applyJob(${job.id})">
                    Apply Now
                </button>

            `;

            jobsContainer.appendChild(jobDiv);

        });

    } catch (error) {

        console.error("Jobs Error:", error);

        document.getElementById("jobs").innerHTML =
            "<p>❌ Cannot connect to server.</p>";
    }
}

async function applyJob(jobId) {

    const userData = localStorage.getItem("user");

    if (!userData) {
        alert("Please login first!");
        window.location.href = "jobseeker-login.html";
        return;
    }

    const user = JSON.parse(userData);

    try {

        const response = await fetch(
            "http://localhost:5000/api/applications",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    job_id: jobId,
                    user_id: user.id
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            alert("✅ Application submitted successfully!");
       await loadApplications();
        } else {

            alert("❌ " + data.message);

        }

    } catch (error) {

        console.error(error);

        alert("❌ Cannot connect to server!");

    }

}
       function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}


        
        loadJobs();
        loadApplications();

    </script>
</body>
</html>
