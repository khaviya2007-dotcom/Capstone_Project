<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Jobs | JobFinder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #17233d;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .back-btn {
            text-decoration: none;
            background: #333;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .job-list {
            display: grid;
            gap: 20px;
        }

        .job-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .job-card h2 {
            margin-top: 0;
        }

        .job-info {
            margin: 8px 0;
            color: #555;
        }

        .description {
            margin-top: 15px;
            line-height: 1.5;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .loading,
        .empty,
        .error {
            background: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 25px;
            border-radius: 10px;
        }

        .modal-box h2 {
            margin-top: 0;
        }

        .modal-box label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        .modal-box input,
        .modal-box textarea,
        .modal-box select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .modal-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .save-btn {
            background: #16a34a;
            color: white;
        }

        .cancel-btn {
            background: #666;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>My Jobs</h1>

        <a href="employer-dashboard.html" class="back-btn">
            ← Dashboard
        </a>
    </div>

    <div id="jobList" class="job-list">
        <div class="loading">
            Loading jobs...
        </div>
    </div>

</div>


<!-- EDIT MODAL -->

<div id="editModal" class="modal">

    <div class="modal-box">

        <h2>Edit Job</h2>

        <form id="editForm">

            <input type="hidden" id="editJobId">

            <label>Job Title</label>
            <input type="text" id="editTitle" required>

            <label>Company</label>
            <input type="text" id="editCompany" required>

            <label>Location</label>
            <input type="text" id="editLocation" required>

            <label>Job Type</label>

            <select id="editType" required>
                <option value="Full Time">Full Time</option>
                <option value="Part Time">Part Time</option>
                <option value="Internship">Internship</option>
                <option value="Remote">Remote</option>
            </select>

            <label>Salary</label>
            <input type="text" id="editSalary" required>

            <label>Description</label>
            <textarea id="editDescription" rows="5" required></textarea>

            <div class="modal-actions">

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeEditModal()">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>


<!-- IMPORTANT: JS FILE MUST BE LOADED LIKE THIS -->

<script src="my-jobs.js"></script>

</body>
</html>
