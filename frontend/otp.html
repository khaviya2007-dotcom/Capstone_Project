<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification | JobPortal</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-right">
            <div class="form-box">
                <h2>OTP Verification 🔐</h2>
                <p>Enter the OTP generated for your login.</p>

                <p>OTP has been sent to your registered email.</p>

                <input
                    type="text"
                    id="otpInput"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                >

                <p id="timer">Time remaining: 60 seconds</p>
                <p id="message"></p>

                <button class="auth-btn" onclick="verifyOTP()">
                    Verify OTP
                </button>
            </div>
        </div>
    </div>

    <script src="otp.js"></script>
</body>
</html>
