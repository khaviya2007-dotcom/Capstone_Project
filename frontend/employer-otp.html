<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employer OTP Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .otp-container {
            width: 400px;
            max-width: 90%;

            background: white;
            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        #emailText {
            color: #333;
            font-weight: bold;
            margin-bottom: 20px;
            word-break: break-word;
        }

        #otp {
            width: 100%;
            padding: 14px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;

            outline: none;
        }

        #otp:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 13px;

            margin-top: 20px;

            border: none;
            border-radius: 6px;

            background: #007bff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            font-size: 14px;
            min-height: 20px;
        }

        .back-link {
            display: block;
            margin-top: 20px;

            color: #007bff;
            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="otp-container">

        <h2>Verify Your Email</h2>

        <p class="subtitle">
    Enter the 6-digit OTP sent to your registered email address.
</p>

<p id="timer" style="font-weight: bold; color: #007bff;">
    OTP expires in 3:00
</p>

        <p id="emailText"></p>

        <form id="otpForm">

            <input
                type="text"
                id="otp"
                name="otp"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >

            <button type="submit" id="verifyButton">
                Verify OTP
            </button>

        </form>

        <p id="message"></p>

        <a href="employer-login.html" class="back-link">
            ← Back to Login
        </a>

    </div>

    <script src="employer-otp.js"></script>

</body>
</html>
